name: Bug report
description: A binding crashes, behaves wrong, or won't compile
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most failures here come down to three things: your JDK version, your OS,
        and whether the bundled `libraylib` loaded. Please fill those in. They
        turn a guess into a diagnosis.

        **Check these two first. Both are expected, not bugs:**

        - **`UnsupportedClassVersionError`, or anything about `java.lang.foreign`
          not existing.** This project needs **JDK 22 or newer** for the Foreign
          Function & Memory API. There is no workaround on an older JDK.
        - **`WARNING: A restricted method in java.lang.foreign.Linker has been
          called`.** Harmless, but it means you ran without the project's JVM
          flags. Pass `--enable-native-access=ALL-UNNAMED`, which suppresses it
          entirely (the `:check` and `:dev` aliases in `deps.edn` already do).

  - type: input
    id: example
    attributes:
      label: What were you running?
      description: The namespace and function, or the raylib-clj-demo scene (e.g. `net.b12n.raylib-clj.scenes.tetris`).
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste the full error output if there is one.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please paste the output of these two commands.
      value: |
        ```
        $ uname -sm
        (paste here, OS and CPU architecture)

        $ java -version
        (paste here, must be 22 or newer)
        ```
    validations:
      required: true

  - type: dropdown
    id: raylib-source
    attributes:
      label: Which libraylib is being used?
      description: |
        raylib-clj prints this on startup, e.g.
        `[raylib] Loading bundled library: libs/macos/libraylib.6.0.0.dylib`
      options:
        - The bundled one under libs/ (the default)
        - A system raylib (brew / apt / pacman / a source build)
        - Nothing printed / not sure
    validations:
      required: true

  - type: textarea
    id: compile-check
    attributes:
      label: Does the headless compile-check pass?
      description: |
        `bb check` requires every namespace under `src/` without opening a
        window. Paste its output here.
      value: |
        ```
        $ bb check
        (paste here)
        ```

  - type: checkboxes
    id: macos
    attributes:
      label: On macOS only
      options:
        - label: I ran it with `clojure`, not `clj` (rlwrap breaks GUI apps)
        - label: If it died on a code signature, I tried `codesign --force --sign - libs/macos/libraylib.6.0.0.dylib`
